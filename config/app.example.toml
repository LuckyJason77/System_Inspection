# 提供 JMeter、脚本、调度、钉钉、报告过滤和输出目录的示例配置。

[jmeter]
executable = "D:/tools/apache-jmeter/bin/jmeter.bat"
properties_file = "D:/tools/apache-jmeter/bin/jmeter.properties"

[scripts]
directory = "../jmx"
timeout_seconds = 3600

[schedule]
timezone = "Asia/Shanghai"
cron = "0 2 * * *"

[dingtalk]
enabled = false
# 启用后取消以下注释并填写企业内部应用机器人的凭据。
# client_id = "dingxxxxxxxx"
# client_secret = "xxxxxxxx"

[output]
directory = "../runs"

[report]
# URL 会先移除 Query 和 fragment，再按以下关键字做不区分大小写的包含匹配。
# 命中的接口不会显示、统计，也不会影响巡检结论。
excluded_url_keywords = []
# 补充程序内置规则未覆盖的日期参数名，按名称精确匹配（不区分大小写）。
additional_date_parameter_names = ["account_period"]
